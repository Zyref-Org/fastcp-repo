# Shared bits for all fcp-php<ver> packages: the templated PHP-FPM systemd unit
# and the tmpfiles entry for the shared /run/fcp. Owned by one package because
# dpkg forbids the same path in multiple packages (the per-version packages
# depend on this one). nginx and Apache also use /run/fcp but keep their own
# RuntimeDirectory=fcp, so they need no dependency on this package.
name: fcp-php-common
arch: all
platform: linux
version: ${PHPCOMMON_VERSION}
release: "3~${CODENAME}"
section: php
priority: optional
maintainer: "FastCP <ops@fastcp.io>"
description: |
  Shared systemd template unit for FastCP PHP-FPM versions. Packaged by FastCP.
vendor: FastCP
homepage: https://fastcp.io
license: Proprietary
depends:
  - logrotate
contents:
  - src: ${REPO}/systemd/fcp-php-fpm@.service
    dst: /usr/lib/systemd/system/fcp-php-fpm@.service
  - src: ${REPO}/systemd/fcp-tmpfiles.conf
    dst: /usr/lib/tmpfiles.d/fcp.conf
  - src: ${REPO}/logrotate/fcp-stack
    dst: /etc/logrotate.d/fcp-stack
    type: config|noreplace
scripts:
  postinstall: ${REPO}/scripts/postinstall-php-common.sh
