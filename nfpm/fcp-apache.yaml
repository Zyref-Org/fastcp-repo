name: fcp-apache
arch: ${ARCH}
platform: linux
version: ${APACHE_VERSION}
release: "3~${CODENAME}"
section: httpd
priority: optional
maintainer: "FastCP <ops@fastcp.io>"
description: |
  FastCP Apache, a customized, optimized build by FastCP: the internal
  application server (listens on 127.0.0.1:81) behind the FastCP nginx reverse
  proxy, executing PHP via each app's PHP-FPM socket with full .htaccess
  support. Built from upstream source into /opt/fcp/apache.
vendor: FastCP
homepage: https://fastcp.io
license: Apache-2.0
# Computed at package time from the built binaries (build/package.sh).
depends:
  - ${FCP_AUTO_DEPS}
contents:
  - src: ${STAGE}/opt/fcp/apache
    dst: /opt/fcp/apache
    type: tree
  - src: ${STAGE}/etc/apache-fcp
    dst: /etc/apache-fcp
    type: tree
    file_info:
      mode: 0755
  - src: ${REPO}/systemd/fcp-apache.service
    dst: /usr/lib/systemd/system/fcp-apache.service
scripts:
  postinstall: ${REPO}/scripts/postinstall-apache.sh
  preremove: ${REPO}/scripts/preremove-apache.sh
  postremove: ${REPO}/scripts/postremove-apache.sh
