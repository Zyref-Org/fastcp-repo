# Templated per PHP version. Build with:
#   PHP_VERSION=8.3 build/build-php.sh
#   PHP_VERSION=8.3 STAGE=... REPO=... nfpm pkg -f this
# Produces package fcp-php8.3 installing PHP-FPM under /opt/fcp/php/8.3.
name: fcp-php${PHP_VERSION}
arch: ${ARCH}
platform: linux
version: ${PHP_FULL_VERSION}
release: "2~${CODENAME}"
section: php
priority: optional
maintainer: "FastCP <ops@fastcp.io>"
description: |
  FastCP PHP ${PHP_VERSION} (PHP-FPM), a customized, optimized build by FastCP.
  Co-installable alongside other versions under /opt/fcp/php/${PHP_VERSION}
  with the common extension set (gd, intl, bcmath, soap, exif, sodium, ...)
  compiled in. Hardened defaults; not on the system PATH.
vendor: FastCP
homepage: https://fastcp.io
license: Proprietary
# Runtime shared-library deps are computed at package time from the built
# binaries (see auto_deps in build/package.sh), so they are always correct
# for the codename being built.
depends:
  - fcp-php-common
  - ${FCP_AUTO_DEPS}
contents:
  - src: ${STAGE}/opt/fcp/php/${PHP_VERSION}
    dst: /opt/fcp/php/${PHP_VERSION}
    type: tree
scripts:
  postinstall: ${REPO}/scripts/postinstall-php.sh
  preremove: ${REPO}/scripts/preremove-php.sh
