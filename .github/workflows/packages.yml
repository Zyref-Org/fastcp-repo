name: build-and-publish-packages

# Builds the FastCP web stack (nginx, apache, PHP-FPM 8.1-8.5, composer,
# wp-cli, php-cli) for each supported Ubuntu LTS and architecture, then signs
# and syncs the APT repository to Cloudflare R2. The fastcp-agent package is
# built and published by the agent's own repository.
#
# Each (codename, arch) is built on a native runner of that exact OS/arch so the
# packages link against the correct system libraries.
#
# Required repository secrets:
#   FCP_GPG_PRIVATE_KEY   armored GPG private key used to sign the repo
#   FCP_GPG_EMAIL         identity of that key (e.g. ops@fastcp.io)
#   R2_ACCESS_KEY_ID      Cloudflare R2 S3 access key id
#   R2_SECRET_ACCESS_KEY  Cloudflare R2 S3 secret
#   R2_ENDPOINT           https://<accountid>.r2.cloudflarestorage.com
#   R2_BUCKET             target bucket name (e.g. fastcp-repo)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      php_versions:
        description: "Space-separated PHP versions"
        default: "8.2 8.3 8.4 8.5"
      artifact_run_id:
        description: "Reuse package artifacts from a previous run instead of rebuilding"
        required: false
        default: ""
  # Fired by the fastcp-agent repo after it uploads new agent .debs to the
  # bucket's incoming/agent/ prefix; republishing ingests them.
  repository_dispatch:
    types: [agent-published]

permissions:
  contents: read

concurrency:
  group: package-repository-production
  cancel-in-progress: false

jobs:
  build:
    name: build ${{ matrix.codename }}/${{ matrix.arch }}
    # Agent releases (repository_dispatch) republish from the existing pool;
    # nothing needs recompiling, so the whole build matrix is skipped.
    if: >-
      github.event_name != 'repository_dispatch' &&
      (github.event_name != 'workflow_dispatch' || inputs.artifact_run_id == '')
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { codename: jammy, arch: amd64, runner: ubuntu-22.04 }
          - { codename: jammy, arch: arm64, runner: ubuntu-22.04-arm }
          - { codename: noble, arch: amd64, runner: ubuntu-24.04 }
          - { codename: noble, arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install build dependencies
        run: bash build/install-build-deps.sh

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.6"

      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0

      # Note: the compiled tree is deliberately not cached. Sources are
      # re-extracted every run (resetting mtimes), so a cache saves no compile
      # time, and multi-GB cache entries get evicted/partially restored, which
      # breaks builds with missing-source make errors.

      - name: Build the full stack
        env:
          PHP_VERSIONS: ${{ github.event.inputs.php_versions || '8.2 8.3 8.4 8.5' }}
        run: |
          gopath=$(go env GOPATH)
          export PATH="${gopath}/bin:$PATH"
          export SOURCE_DATE_EPOCH
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          bash build/build-all.sh

      - name: Generate package SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: dist
          output-file: dist/fastcp-${{ matrix.codename }}-${{ matrix.arch }}.spdx.json
          upload-artifact: false

      - name: Record build provenance
        run: |
          jq -n \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg ref "${GITHUB_REF}" \
            --arg commit "${GITHUB_SHA}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --arg workflow "${GITHUB_WORKFLOW}" \
            --arg codename "${{ matrix.codename }}" \
            --arg architecture "${{ matrix.arch }}" \
            '{repository:$repository,ref:$ref,commit:$commit,run_id:$run_id,workflow:$workflow,
              runner:"github-hosted",codename:$codename,architecture:$architecture}' \
            > dist/provenance.json

      - name: Generate checksums
        run: |
          cd dist
          sha256sum -- *.deb *.spdx.json provenance.json > SHA256SUMS

      - name: Upload packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: debs-${{ matrix.codename }}-${{ matrix.arch }}
          path: |
            dist/*.deb
            dist/*.spdx.json
            dist/provenance.json
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

      - name: Inspect package metadata
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends lintian
          for deb in dist/*.deb; do
            dpkg-deb --info "$deb" >/dev/null
            dpkg-deb --contents "$deb" >/dev/null
            lintian --fail-on error \
              --suppress-tags dir-or-file-in-opt,file-in-etc-not-marked-as-conffile,unstripped-binary-or-object \
              "$deb"
          done

      - name: Install fcp-mysql on supported Ubuntu releases
        if: matrix.codename == 'noble' && matrix.arch == 'amd64'
        run: bash test/mysql-package-docker.sh dist/fcp-mysql_*.deb

  publish:
    name: sign and publish to R2
    needs: build
    # Runs after successful builds, and also when builds were skipped
    # (repository_dispatch): publish-ci.sh then reuses the published pool.
    if: >-
      !cancelled() && !failure() &&
      (github.event_name == 'repository_dispatch' ||
       startsWith(github.ref, 'refs/tags/v') ||
       (github.event_name == 'workflow_dispatch' && inputs.artifact_run_id != ''))
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install aptly, rclone, gnupg
        run: |
          sudo apt-get update -y
          sudo apt-get install -y aptly rclone gnupg jq

      - name: Download all built packages
        if: github.event_name != 'repository_dispatch'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          run-id: ${{ inputs.artifact_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Import signing key
        env:
          FCP_GPG_PRIVATE_KEY: ${{ secrets.FCP_GPG_PRIVATE_KEY }}
        run: |
          printf '%s' "$FCP_GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Configure rclone for R2
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${{ secrets.R2_ACCESS_KEY_ID }}
          secret_access_key = ${{ secrets.R2_SECRET_ACCESS_KEY }}
          endpoint = ${{ secrets.R2_ENDPOINT }}
          region = auto
          acl = private
          # Bucket-scoped R2 tokens cannot list/create buckets; without this
          # rclone attempts CreateBucket and R2 replies 501 NotImplemented.
          no_check_bucket = true
          EOF
          chmod 0600 ~/.config/rclone/rclone.conf

      - name: Publish and sync to R2
        env:
          ARTIFACTS_DIR: artifacts
          CODENAMES: "jammy noble"
          FCP_GPG_EMAIL: ${{ secrets.FCP_GPG_EMAIL }}
          FCP_R2_REMOTE: r2
          FCP_R2_BUCKET: ${{ secrets.R2_BUCKET }}
          EXPECTED_AGENT_MANIFEST_SHA: ${{ github.event.client_payload.manifest_sha }}
          DISPATCH_AGENT_REPOSITORY: ${{ github.event.client_payload.repository }}
          DISPATCH_AGENT_REF: ${{ github.event.client_payload.ref }}
          DISPATCH_AGENT_COMMIT: ${{ github.event.client_payload.commit }}
          DISPATCH_AGENT_RUN_ID: ${{ github.event.client_payload.run_id }}
          EXPECTED_AGENT_REPOSITORY: Zyref-Org/fastcp-agent
          FCP_SNAPSHOT_ID: ${{ github.run_id }}-${{ github.sha }}
        run: bash repo/publish-ci.sh

      - name: Verify published noble repository
        env:
          FCP_REPO_URL: https://repo.fastcp.io
        run: sudo -E bash test/smoke-from-repo.sh
